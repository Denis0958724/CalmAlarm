name: Сервер - перевірка і розгортання

# Тести запускаються завжди. Розгортання в Cloudflare - лише якщо додано секрети
# CLOUDFLARE_API_TOKEN і CLOUDFLARE_ACCOUNT_ID (і ключ APNs: APNS_KEY, APNS_KEY_ID, APPLE_TEAM_ID).
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тести
        working-directory: server
        run: npm test

      - name: Чи є доступ до Cloudflare
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Секретів Cloudflare ще немає - лише тести, без розгортання."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: База даних D1
        if: steps.cf.outputs.ready == 'true'
        working-directory: server
        run: |
          W="npx -y wrangler@4"
          ID=$($W d1 list --json | jq -r '.[] | select(.name=="calmalarm") | .uuid')
          if [ -z "$ID" ]; then
            $W d1 create calmalarm
            ID=$($W d1 list --json | jq -r '.[] | select(.name=="calmalarm") | .uuid')
          fi
          [ -n "$ID" ] || { echo "::error::Не вдалося створити базу D1 (перевірте дозвіл D1: Edit у токені)."; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          $W d1 execute calmalarm --remote --file schema.sql

      - name: Розгорнути
        if: steps.cf.outputs.ready == 'true'
        working-directory: server
        run: |
          npx -y wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            if grep -qi "subdomain" deploy.log; then
              echo "::error::Відкрийте в Cloudflare розділ Workers & Pages один раз, щоб вибрати піддомен workers.dev, і запустіть знову."
            fi
            exit 1
          fi
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "### Сервер працює: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Секрети сервера (ключ APNs)
        if: steps.cf.outputs.ready == 'true'
        working-directory: server
        env:
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        run: |
          node -e '
            const out = {};
            for (const k of ["APNS_KEY", "APNS_KEY_ID", "APNS_TEAM_ID", "SUPPORT_EMAIL"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            console.log("Секрети: " + (Object.keys(out).join(", ") || "немає"));
          '
          if [ "$(cat "$RUNNER_TEMP/secrets.json")" != "{}" ]; then
            npx -y wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json"
          fi
          rm -f "$RUNNER_TEMP/secrets.json"
          [ -n "$APNS_KEY" ] || echo "::warning::Немає ключа APNs (APNS_KEY) - сервер не зможе надсилати сигнали на iPhone."

      - name: Записати адресу сервера для збірки iOS
        if: steps.cf.outputs.ready == 'true'
        run: |
          curl -sSf "$URL/health" || echo "::warning::Сервер ще не відповідає (так буває в перші хвилини)."
          if [ "$(cat server/url.txt 2>/dev/null)" != "$URL" ]; then
            echo "$URL" > server/url.txt
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git add server/url.txt
            git commit -q -m "Адреса сервера: $URL [skip ci]"
            git push
          fi
