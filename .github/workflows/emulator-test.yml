name: Перевірка на емуляторі

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pick a calm oblast for the test
        run: |
          curl -s -m 20 https://siren.pp.ua/api/v3/alerts -o /tmp/alerts.json || true
          curl -s -m 30 https://siren.pp.ua/api/v3/regions -o /tmp/regions.json || true
          python3 ci/pick_calm.py /tmp/alerts.json /tmp/regions.json > /tmp/calm.txt || echo "11|Закарпатська область" > /tmp/calm.txt
          python3 ci/pick_active.py /tmp/alerts.json /tmp/regions.json > /tmp/active.txt || echo "16|Луганська область||" > /tmp/active.txt
          cat /tmp/calm.txt /tmp/active.txt

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          disk-size: 4096M
          cores: 2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: bash ci/emulator-test.sh

      - name: Publish screenshots to branch ci-screens
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p ci-out && date > ci-out/run.txt
          git checkout --orphan ci-screens
          git rm -rf --cached . > /dev/null
          git add -f ci-out
          git commit -q -m "Screenshots from run ${{ github.run_number }}"
          git push -f origin ci-screens
