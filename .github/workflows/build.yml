name: Зібрати APK

on:
  push:
    branches: [main]
    paths-ignore: ['ci/**', '.github/workflows/emulator-test.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk CalmAlarm.apk
          cp app/build/outputs/bundle/release/app-release.aab CalmAlarm.aab

      - uses: actions/upload-artifact@v4
        with:
          name: CalmAlarm-apk
          path: |
            CalmAlarm.apk
            CalmAlarm.aab

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CalmAlarm v1.0.${{ github.run_number }}
          body: |
            CalmAlarm.apk - для встановлення на телефон.
            CalmAlarm.aab - для завантаження в Google Play.
          files: |
            CalmAlarm.apk
            CalmAlarm.aab
