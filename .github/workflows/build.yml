name: Зібрати APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Vidbij.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vidbij-apk
          path: Vidbij.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Відбій v1.0.${{ github.run_number }}
          body: Завантажте файл Vidbij.apk на телефон і відкрийте його, щоб встановити.
          files: Vidbij.apk
