name: Зібрати APK

on:
  push:
    branches: [main]
    paths-ignore: ['ci/**', 'ios/**', 'server/**', 'tools/**', '.github/workflows/emulator-test.yml', '.github/workflows/android-screens.yml', '.github/workflows/ios*.yml', '.github/workflows/server*.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -Pdonate=true --stacktrace 2>&1 | tee build.log
          ./gradlew bundleRelease --stacktrace 2>&1 | tee -a build.log

      - name: Publish build errors to branch android-log
        if: failure()
        run: |
          mkdir -p /tmp/out
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -200 > /tmp/out/errors.txt || true
          tail -80 build.log > /tmp/out/tail.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan android-log
          git rm -rf --cached . > /dev/null
          rm -rf ci-out && mkdir ci-out && cp /tmp/out/* ci-out/
          git add -f ci-out
          git commit -q -m "Android build log ${{ github.run_number }}"
          git push -f origin android-log

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk CalmAlarm.apk
          cp app/build/outputs/bundle/release/app-release.aab CalmAlarm.aab

      - uses: actions/upload-artifact@v4
        with:
          name: CalmAlarm-apk
          path: |
            CalmAlarm.apk
            CalmAlarm.aab

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CalmAlarm v1.0.${{ github.run_number }}
          body: |
            CalmAlarm.apk - для встановлення на телефон.
            CalmAlarm.aab - для завантаження в Google Play (без кнопки «Підтримати»).
          files: |
            CalmAlarm.apk
            CalmAlarm.aab
